<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Administrativo Inteligente — W3G Consultoria Corporativa</title>
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/sistema.css">
<script>
  // aplica o tema antes da primeira pintura (evita piscar)
  try {
    if (localStorage.getItem("w3g_tema") === "escuro") {
      document.documentElement.setAttribute("data-tema", "escuro");
    }
  } catch (e) {}
</script>
</head>
<body>

<header class="topo">
  <div class="app" style="padding-bottom:0">
    <div class="topo-linha">
      <div class="marca">
        <img class="marca-logo" src="/img/w3g-marca.png" alt="W3G Consultoria Corporativa">
        <span class="marca-nome">Sistema Administrativo Inteligente</span>
      </div>

      <!-- BUSCA GLOBAL: acha a proposta em qualquer etapa -->
      <div class="busca">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="busca" class="campo" type="search" autocomplete="off"
               placeholder="Buscar empresa, CNPJ, proposta, corretor…" aria-label="Busca global">
      </div>

      <div class="topo-acoes">
        <!-- USUÁRIO: filtra o sistema inteiro para a carteira de uma ADM -->
        <div class="seletor-usuario">
          <span class="rotulo" style="margin:0">Usuário</span>
          <select id="usuario" aria-label="Usuário">
            <option value="">Todos</option>
          </select>
        </div>
        <button id="btn-nova" class="btn">+ Proposta</button>
        <button id="btn-tema" class="btn btn-limpo" title="Claro / escuro" aria-label="Alternar tema">◐</button>
      </div>
    </div>

    <nav class="abas" id="abas"></nav>
  </div>
</header>

<main class="app" id="tela"></main>

<div class="veu" id="veu"></div>
<aside class="ficha" id="ficha" aria-hidden="true" aria-label="Ficha da proposta">
  <div class="ficha-cabeca" id="ficha-cabeca"></div>
  <div class="ficha-corpo" id="ficha-corpo"></div>
</aside>

<div class="modal oculto" id="modal"></div>
<div class="aviso" id="aviso" role="status"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
